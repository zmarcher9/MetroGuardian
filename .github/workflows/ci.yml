name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Never actually connected to in CI — the app only opens a DB connection
      # inside the FastAPI startup lifespan, which a plain `import app.main`
      # doesn't trigger. This just needs to be a syntactically valid URL so
      # Settings.database_url doesn't raise at import time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create venv (matches backend/pyrightconfig.json)
        run: python -m venv venv
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements-dev.txt
          pip install pyright
      - name: Type check
        run: |
          source venv/bin/activate
          pyright
      - name: Import check
        run: |
          source venv/bin/activate
          python -c "import app.main"
      - name: Unit tests
        run: |
          source venv/bin/activate
          # DATABASE_URL above is a placeholder, not a real Postgres instance, so
          # db-marked tests auto-skip here (see backend/tests/conftest.py). Only
          # a real DATABASE_URL (e.g. run locally against Supabase) exercises them.
          pytest -v
